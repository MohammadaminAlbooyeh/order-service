server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME:platform}
    password: ${DB_PASSWORD:platform}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"
        isolation.level: read_committed
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 5000
        enable.idempotence: true
        acks: all
        retries: 3
    listener:
      ack-mode: manual_immediate
      concurrency: 3
    retry:
      topic:
        suffix: .DLT
      attempts: 3
      initial-interval: 1000
      multiplier: 2.0
      max-interval: 10000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

# Static shared-secret for the HTTP API (sits behind the gateway).
# Leave blank to run without authentication (local / tests).
security:
  api-key: ${API_KEY:}

# Redis-backed fixed-window rate limit for /api/**, shared across instances. Fails open.
ratelimit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  requests-per-window: ${RATE_LIMIT_REQUESTS:120}
  window-ms: ${RATE_LIMIT_WINDOW_MS:10000}

# Transactional outbox relay: drains PENDING rows to Kafka on a fixed delay.
outbox:
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
  batch-size: ${OUTBOX_BATCH_SIZE:100}

# Stale-order expiry sweeper.
order:
  expiry:
    ttl-minutes: ${ORDER_EXPIRY_TTL_MINUTES:15}
    enabled: ${ORDER_EXPIRY_ENABLED:true}
    poll-interval-ms: ${ORDER_EXPIRY_POLL_INTERVAL_MS:60000}